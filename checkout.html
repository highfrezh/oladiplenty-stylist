<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Oladiplenty Stylist Consult</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --magenta:#D91C73; --magenta-deep:#B4145E;
    --terracotta:#C17D4E; --terracotta-deep:#A5673E;
    --ink:#241419; --ink-soft:#4A3540;
    --blush:#FBF3EF; --blush-deep:#F5E7E0;
    --card:#FFFFFF; --line:#E9D9CE; --gold:#B08D57; --radius:2px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--blush); color:var(--ink); font-family:'Manrope',sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; margin:0; letter-spacing:-0.01em; }
  a{color:inherit; text-decoration:none;}
  .eyebrow{ text-transform:uppercase; letter-spacing:0.16em; font-size:12px; font-weight:700; color:var(--terracotta-deep); }
  .wrap{ max-width:1100px; margin:0 auto; padding:0 40px; }
  @media(max-width:640px){ .wrap{padding:0 20px;} }

  .monogram{position:relative; display:inline-block;}
  .monogram .o,.monogram .s{ position:absolute; top:0; left:0; font-family:'Fraunces',serif; font-style:italic; font-weight:600; line-height:1; mix-blend-mode:multiply; }
  .monogram .o{color:var(--magenta);}
  .monogram .s{color:var(--terracotta); left:0.34em;}

  header{ position:sticky; top:0; z-index:50; background:rgba(251,243,239,0.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav-inner{ max-width:1240px; margin:0 auto; padding:18px 40px; display:flex; align-items:center; justify-content:space-between; }
  @media(max-width:640px){ .nav-inner{padding:18px 20px;} }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .monogram{font-size:32px; width:0.86em; height:1em;}
  .brand .word{ font-weight:800; font-size:14px; letter-spacing:0.1em; text-transform:uppercase; }
  .steps{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--ink-soft);}
  .steps .on{color:var(--magenta); font-weight:700;}

  .breadcrumb{ max-width:1240px; margin:0 auto; padding:22px 40px 0; font-size:12.5px; color:var(--ink-soft); }
  @media(max-width:640px){ .breadcrumb{padding:22px 20px 0;} }
  .breadcrumb span{margin:0 8px; opacity:0.5;}
  .breadcrumb a:hover{color:var(--magenta);}

  .intro{padding:30px 0 10px;}
  .intro h1{font-size:clamp(26px,3.4vw,36px); font-style:italic; font-weight:500;}

  .checkout-page{padding:20px 0 100px;}
  .co-grid{display:grid; grid-template-columns:1.4fr 1fr; gap:50px; align-items:flex-start;}
  @media(max-width:900px){ .co-grid{grid-template-columns:1fr;} }

  .co-section{margin-top:34px;}
  .co-section:first-child{margin-top:10px;}
  .co-section h3{font-size:14px; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; color:var(--ink-soft); margin-bottom:16px;}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:520px){ .form-row{grid-template-columns:1fr;} }
  .field{margin-top:14px;}
  .field:first-child{margin-top:0;}
  .field label{ display:block; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:7px; }
  .field input, .field select{
    width:100%; border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;
    font-family:'Manrope'; font-size:13.5px; background:var(--card);
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--magenta);}

  .option-card{ display:flex; align-items:flex-start; gap:14px; border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; cursor:pointer; margin-top:10px; background:var(--card); transition:border-color .15s ease; }
  .option-card:hover{border-color:var(--ink);}
  .option-card.selected{border-color:var(--magenta); background:var(--blush-deep);}
  .option-card input{margin-top:3px;}
  .option-card .ot{font-size:13.5px; font-weight:700;}
  .option-card .os{font-size:12px; color:var(--ink-soft); margin-top:3px;}
  .option-card .op{margin-left:auto; font-weight:700; font-size:13.5px; white-space:nowrap;}

  .summary{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:28px; position:sticky; top:96px; }
  .summary h3{font-size:15px; font-weight:700;}
  .mini-item{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-top:14px; color:var(--ink-soft);}
  .mini-item .n{color:var(--ink); font-weight:600;}
  .sum-row{display:flex; justify-content:space-between; font-size:13px; margin-top:12px; color:var(--ink-soft); padding-top:12px; border-top:1px solid var(--line);}
  .sum-row.total{margin-top:14px; font-weight:700; color:var(--ink); font-size:15px;}

  .place-btn{ width:100%; margin-top:22px; padding:15px; background:var(--magenta); color:#fff; border:none; border-radius:var(--radius); font-weight:700; text-transform:uppercase; font-size:12.5px; letter-spacing:0.05em; cursor:pointer; transition:background .2s ease; }
  .place-btn:hover{background:var(--magenta-deep);}
  .place-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}

  .confirm-panel{ text-align:center; padding:70px 20px; }
  .confirm-panel .ic{ width:64px; height:64px; border-radius:50%; background:var(--magenta); color:#fff; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto; }
  .confirm-panel h2{margin-top:24px; font-size:28px; font-style:italic; font-weight:500;}
  .confirm-panel p{margin-top:12px; font-size:14px; color:var(--ink-soft); max-width:420px; margin-left:auto; margin-right:auto; line-height:1.6;}
  .confirm-panel .order-no{ display:inline-block; margin-top:20px; background:var(--blush-deep); border:1px solid var(--line); padding:10px 20px; border-radius:30px; font-weight:700; font-size:13px; letter-spacing:0.03em; }
  .confirm-panel .btn{ margin-top:28px; display:inline-flex; background:var(--ink); color:#fff; padding:14px 28px; border-radius:var(--radius); font-weight:700; font-size:12.5px; text-transform:uppercase; letter-spacing:0.05em; }
  .confirm-panel .btn:hover{background:var(--magenta);}

  footer{background:var(--ink); color:rgba(255,255,255,0.7); padding:56px 0 30px; margin-top:40px;}
  .foot-row{ max-width:1240px; margin:0 auto; padding:0 40px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; }
  @media(max-width:640px){ .foot-row{padding:0 20px;} }
  .foot-brand{display:flex; align-items:center; gap:12px;}
  .foot-brand .monogram{font-size:28px; width:0.86em; height:1em;}
  .foot-brand .monogram .o{color:var(--magenta); mix-blend-mode:normal; opacity:0.95;}
  .foot-brand .monogram .s{color:var(--terracotta); mix-blend-mode:normal; opacity:0.95;}
  .foot-links{display:flex; gap:24px; font-size:13px;}
  .foot-links a:hover{color:#fff;}

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{ outline:2px solid var(--magenta); outline-offset:3px; }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <span class="monogram"><span class="o">O</span><span class="s">S</span></span>
      <span class="word">Oladiplenty</span>
    </a>
    <div class="steps">
      <a href="cart.html">Bag</a><span>→</span><span class="on">Checkout</span><span>→</span><span>Confirmation</span>
    </div>
  </div>
</header>

<div class="breadcrumb">
  <a href="index.html">Home</a><span>/</span>
  <a href="cart.html">Your Bag</a><span>/</span>
  <span style="color:var(--ink); font-weight:600;">Checkout</span>
</div>

<div class="wrap intro">
  <p class="eyebrow">Checkout</p>
  <h1>Complete your order</h1>
</div>

<section class="checkout-page">
  <div class="wrap" id="checkoutContent"></div>
</section>

<footer>
  <div class="foot-row">
    <a class="foot-brand" href="index.html">
      <span class="monogram"><span class="o">O</span><span class="s">S</span></span>
      <span>Oladiplenty Stylist Consult</span>
    </a>
    <div class="foot-links">
      <a href="mailto:oladiplentystylist@gmail.com">oladiplentystylist@gmail.com</a>
      <a href="https://wa.me/447450207203">WhatsApp +44 7450 207203</a>
    </div>
  </div>
</footer>

<script>
  const CART_KEY = 'oladiplenty_cart';
  const PROMO_KEY = 'oladiplenty_promo';

  function getCart(){ try{ return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }catch(e){ return []; } }
  function money(n){ return '£' + n.toFixed(2); }

  const deliveryOptions = [
    {id:'uk-standard', label:'UK Standard', desc:'3–5 working days', price:6.50},
    {id:'uk-express', label:'UK Express', desc:'1–2 working days', price:12.00},
    {id:'europe', label:'Europe Standard', desc:'7–10 working days', price:15.00},
  ];
  let selectedDelivery = 'uk-standard';
  let selectedPayment = 'card';

  function calcTotals(){
    const cart = getCart();
    const subtotal = cart.reduce((s,i)=>s+i.price*i.qty,0);
    const promo = JSON.parse(localStorage.getItem(PROMO_KEY) || 'null');
    const discount = promo ? subtotal * promo.rate : 0;
    const delivery = deliveryOptions.find(d=>d.id===selectedDelivery);
    const shipping = subtotal > 150 && selectedDelivery === 'uk-standard' ? 0 : delivery.price;
    const total = subtotal - discount + shipping;
    return {cart, subtotal, promo, discount, shipping, total};
  }

  function renderCheckout(){
    const {cart, subtotal, promo, discount, shipping, total} = calcTotals();
    const content = document.getElementById('checkoutContent');

    if(cart.length === 0){
      content.innerHTML = `
        <div class="confirm-panel">
          <h2>Your bag is empty</h2>
          <p>Add something to your bag before checking out.</p>
          <a href="ready-to-wear.html" class="btn">Shop Ready to Wear</a>
        </div>`;
      return;
    }

    const miniItems = cart.map(i => `<div class="mini-item"><span class="n">${i.qty} × ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('');
    const deliveryHtml = deliveryOptions.map(d => `
      <label class="option-card ${d.id===selectedDelivery?'selected':''}" data-delivery="${d.id}">
        <input type="radio" name="delivery" value="${d.id}" ${d.id===selectedDelivery?'checked':''}>
        <div><div class="ot">${d.label}</div><div class="os">${d.desc}</div></div>
        <div class="op">${money(d.price)}</div>
      </label>`).join('');

    content.innerHTML = `
      <div class="co-grid">
        <div>
          <div class="co-section">
            <h3>Contact Details</h3>
            <div class="field"><label for="coEmail">Email Address</label><input type="email" id="coEmail" required></div>
            <div class="form-row" style="margin-top:14px;">
              <div class="field"><label for="coName">Full Name</label><input type="text" id="coName" required></div>
              <div class="field"><label for="coPhone">Phone</label><input type="tel" id="coPhone" required></div>
            </div>
          </div>

          <div class="co-section">
            <h3>Shipping Address</h3>
            <div class="field"><label for="coAddr1">Address Line 1</label><input type="text" id="coAddr1" required></div>
            <div class="form-row" style="margin-top:14px;">
              <div class="field"><label for="coCity">City</label><input type="text" id="coCity" required></div>
              <div class="field"><label for="coPostcode">Postcode</label><input type="text" id="coPostcode" required></div>
            </div>
            <div class="field">
              <label for="coCountry">Country</label>
              <select id="coCountry">
                <option>United Kingdom</option>
                <option>Ireland</option>
                <option>France</option>
                <option>Germany</option>
                <option>Other (Europe)</option>
              </select>
            </div>
          </div>

          <div class="co-section">
            <h3>Delivery Method</h3>
            ${deliveryHtml}
          </div>

          <div class="co-section">
            <h3>Payment Method</h3>
            <label class="option-card ${selectedPayment==='card'?'selected':''}" data-payment="card">
              <input type="radio" name="payment" value="card" ${selectedPayment==='card'?'checked':''}>
              <div><div class="ot">Debit / Credit Card</div><div class="os">Visa, Mastercard, Amex — processed securely</div></div>
            </label>
            <label class="option-card ${selectedPayment==='paypal'?'selected':''}" data-payment="paypal">
              <input type="radio" name="payment" value="paypal" ${selectedPayment==='paypal'?'checked':''}>
              <div><div class="ot">PayPal</div><div class="os">You'll be redirected to complete payment</div></div>
            </label>
          </div>
        </div>

        <div class="summary">
          <h3>Order Summary</h3>
          ${miniItems}
          <div class="sum-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          ${promo ? `<div class="sum-row"><span>Promo (${promo.code})</span><span>-${money(discount)}</span></div>` : ''}
          <div class="sum-row"><span>Shipping</span><span>${shipping === 0 ? 'Free' : money(shipping)}</span></div>
          <div class="sum-row total"><span>Total</span><span>${money(total)}</span></div>
          <button class="place-btn" id="placeOrderBtn">Place Order — ${money(total)}</button>
        </div>
      </div>
    `;

    // Wire delivery + payment option cards
    content.querySelectorAll('[data-delivery]').forEach(el=>{
      el.addEventListener('click', ()=>{ selectedDelivery = el.dataset.delivery; renderCheckout(); });
    });
    content.querySelectorAll('[data-payment]').forEach(el=>{
      el.addEventListener('click', ()=>{ selectedPayment = el.dataset.payment; renderCheckout(); });
    });

    document.getElementById('placeOrderBtn').addEventListener('click', placeOrder);
  }

  function placeOrder(){
    const email = document.getElementById('coEmail').value.trim();
    const name = document.getElementById('coName').value.trim();
    const phone = document.getElementById('coPhone').value.trim();
    const addr1 = document.getElementById('coAddr1').value.trim();
    const city = document.getElementById('coCity').value.trim();
    const postcode = document.getElementById('coPostcode').value.trim();

    if(!email || !name || !phone || !addr1 || !city || !postcode){
      alert('Please fill in all required fields before placing your order.');
      return;
    }

    const orderNo = 'OSC-' + Math.floor(100000 + Math.random()*899999);
    const {total} = calcTotals();

    document.getElementById('checkoutContent').innerHTML = `
      <div class="confirm-panel">
        <div class="ic">✓</div>
        <h2>Thank you, ${name.split(' ')[0]}!</h2>
        <p>Your order has been placed successfully. A confirmation has been sent to ${email}, and we'll notify you as soon as it ships.</p>
        <div class="order-no">Order ${orderNo} · ${money(total)}</div>
        <br>
        <a href="index.html" class="btn">Continue Shopping</a>
      </div>
    `;

    localStorage.removeItem(CART_KEY);
    localStorage.removeItem(PROMO_KEY);
  }

  renderCheckout();
</script>

</body>
</html>
